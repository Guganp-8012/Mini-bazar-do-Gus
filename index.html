<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Bazar</title>
<style>
  :root{--bg:#faf8f5;--card:#fff;--ink:#2b2622;--mut:#7a7068;--acc:#c2410c;--bd:#e8e2da}
  @media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--ink:#f5f0ea;--mut:#a8a29e;--acc:#fb923c;--bd:#3f3a36}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:28px 16px 12px;max-width:1000px;margin:auto}
  h1{margin:0;font-size:1.9rem}
  header p{margin:4px 0 0;color:var(--mut)}
  .tools{max-width:1000px;margin:12px auto;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
  input,select{padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem}
  input{flex:1;min-width:180px}
  main{max-width:1000px;margin:auto;padding:8px 16px 48px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
  .card:hover{border-color:var(--acc)}
  .ph{aspect-ratio:1;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:.9rem;position:relative}
  .ph img{width:100%;height:100%;object-fit:cover}
  .info{padding:12px}
  .info h3{margin:0 0 4px;font-size:1rem}
  .preco{font-weight:700;color:var(--acc)}
  .tag{font-size:.75rem;color:var(--mut)}
  .vendido{position:absolute;top:8px;left:8px;background:#000a;color:#fff;padding:2px 8px;border-radius:99px;font-size:.75rem}
  .detail{display:grid;gap:16px;max-width:640px;margin:auto}
  .detail .ph{border-radius:14px;overflow:hidden}
  .thumbs{display:flex;gap:8px;overflow-x:auto}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:14px 18px;border-radius:12px;font-weight:700;text-align:center;border:0;font-size:1rem;cursor:pointer}
  .back{background:none;border:0;color:var(--acc);font-size:1rem;cursor:pointer;padding:0;margin:8px 0}
  .empty{text-align:center;color:var(--mut);padding:40px 0}
  footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px}
</style>
</head>
<body>
<header><h1 id="titulo"></h1><p id="desc"></p></header>
<div id="tools" class="tools">
  <input id="q" type="search" placeholder="Buscar produto...">
  <select id="cat"><option value="">Todas as categorias</option></select>
</div>
<main id="app"></main>
<footer>Pagamento e entrega combinados diretamente com o vendedor.</footer>

<script src="config.js"></script>
<script>
const C = window.BAZAR;
const brl = n => new Intl.NumberFormat('pt-BR',{style:'currency',currency:C.moeda}).format(n);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let produtos = [];

document.title = C.nome;
document.getElementById('titulo').textContent = C.nome;
document.getElementById('desc').textContent = C.descricao;

function zapLink(p){
  const num = atob(C.whatsappB64);
  const msg = `Olá! Tenho interesse em: ${p.nome} (${brl(p.preco)}). Ainda está disponível?`;
  return `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}

function img(p, i = 0){
  const src = p.imagens && p.imagens[i];
  return src ? `<img src="${esc(src)}" alt="${esc(p.nome)}" loading="lazy">` : 'sem foto';
}

function lista(){
  document.getElementById('tools').style.display = 'flex';
  const q = document.getElementById('q').value.toLowerCase();
  const cat = document.getElementById('cat').value;
  const itens = produtos.filter(p =>
    p.status !== 'oculto' &&
    (!cat || p.categoria === cat) &&
    (p.nome + ' ' + p.descricao).toLowerCase().includes(q));
  const app = document.getElementById('app');
  if(!itens.length){ app.innerHTML = '<div class="empty">Nenhum produto encontrado.</div>'; return; }
  app.innerHTML = '<div class="grid">' + itens.map(p => `
    <div class="card" data-id="${esc(p.id)}">
      <div class="ph">${img(p)}${p.status==='vendido'?'<span class="vendido">Vendido</span>':''}</div>
      <div class="info"><h3>${esc(p.nome)}</h3>
        <div class="preco">${brl(p.preco)}</div>
        <div class="tag">${esc(p.condicao)} · ${esc(p.categoria)}</div></div>
    </div>`).join('') + '</div>';
  app.querySelectorAll('.card').forEach(c => c.onclick = () => { location.hash = c.dataset.id; });
}

function detalhe(p){
  document.getElementById('tools').style.display = 'none';
  const vendido = p.status === 'vendido';
  const thumbs = (p.imagens||[]).length > 1
    ? '<div class="thumbs">' + p.imagens.map((s,i)=>`<img src="${esc(s)}" data-i="${i}" alt="">`).join('') + '</div>' : '';
  document.getElementById('app').innerHTML = `
    <button class="back" onclick="location.hash=''">← Voltar</button>
    <div class="detail">
      <div class="ph" id="main-ph">${img(p)}</div>${thumbs}
      <div><h2 style="margin:0">${esc(p.nome)}</h2>
        <div class="preco" style="font-size:1.4rem">${brl(p.preco)}</div>
        <div class="tag">${esc(p.condicao)} · ${esc(p.categoria)}</div></div>
      <p style="white-space:pre-wrap;margin:0">${esc(p.descricao)}</p>
      ${vendido ? '<div class="empty">Este item já foi vendido.</div>'
                : `<a class="btn" href="${zapLink(p)}" target="_blank" rel="noopener">Chamar no WhatsApp</a>`}
    </div>`;
  document.querySelectorAll('.thumbs img').forEach(t => t.onclick = () => {
    document.getElementById('main-ph').innerHTML = img(p, +t.dataset.i);
  });
  window.scrollTo(0,0);
}

function rota(){
  const id = decodeURIComponent(location.hash.slice(1));
  const p = produtos.find(x => x.id === id);
  p ? detalhe(p) : lista();
}

fetch('products.json?v=' + Date.now()).then(r => r.json()).then(d => {
  produtos = d;
  const cats = [...new Set(d.filter(p=>p.status!=='oculto').map(p => p.categoria))].sort();
  document.getElementById('cat').innerHTML += cats.map(c => `<option>${esc(c)}</option>`).join('');
  document.getElementById('q').oninput = lista;
  document.getElementById('cat').onchange = lista;
  window.onhashchange = rota;
  rota();
}).catch(() => { document.getElementById('app').innerHTML = '<div class="empty">Não foi possível carregar o catálogo.</div>'; });
</script>
</body>
</html>
