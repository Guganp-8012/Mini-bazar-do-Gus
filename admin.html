<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Bazar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Young+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light dark;
    --linho:#F1EFE4; --papel:#FBFAF3; --tinta:#2B352E; --suave:#5A6454;
    --musgo:#3E6B50; --musgo-esc:#2F5640; --sobre-musgo:#fff;
    --etiqueta:#F0C14B; --sobre-etiqueta:#2B352E;
    --borda:#D8D3BE; --vendido:#7A5C58; --erro:#A63D2F;
    --serif:'Young Serif',Georgia,serif; --sans:'Nunito',system-ui,sans-serif;
  }
  @media(prefers-color-scheme:dark){:root{
    --linho:#1E241F; --papel:#273029; --tinta:#ECEAD9; --suave:#A9B2A0;
    --musgo:#8CC2A0; --musgo-esc:#A6D3B6; --sobre-musgo:#1E241F;
    --etiqueta:#E3B53F; --sobre-etiqueta:#222A24;
    --borda:#3A453C; --vendido:#A07E78; --erro:#D9776A;
  }}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--linho);color:var(--tinta);line-height:1.5}
  :focus-visible{outline:3px solid var(--musgo);outline-offset:2px}
  .wrap{max-width:820px;margin:auto;padding:16px}
  h1{font-family:var(--serif);font-weight:400;font-size:1.7rem;margin:8px 0 16px}
  .box{background:var(--papel);border:1px solid var(--borda);border-radius:12px;padding:16px;margin-bottom:16px}
  .box h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.2rem}
  label{display:block;font-size:.85rem;font-weight:600;color:var(--suave);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--borda);border-radius:10px;background:var(--linho);color:var(--tinta);font:inherit}
  textarea{min-height:90px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{padding:10px 16px;border:0;border-radius:10px;background:var(--musgo);color:var(--sobre-musgo);font:inherit;font-weight:800;cursor:pointer}
  button:hover{background:var(--musgo-esc)}
  button:disabled{opacity:.6;cursor:wait}
  button.sec{background:transparent;color:var(--tinta);border:1px solid var(--borda)}
  button.sec:hover{border-color:var(--musgo)}
  button.del{background:transparent;color:var(--erro);border:1px solid var(--borda)}
  button.del:hover{border-color:var(--erro)}
  .topo-lista{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .acts button,.item button{padding:6px 12px;font-size:.85rem}
  .item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--borda);flex-wrap:wrap}
  .item:first-of-type{border-top:0}
  .item img,.item .nofoto{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--borda);flex:none}
  .item .t{flex:1;min-width:140px}
  .item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item small{color:var(--suave)}
  .item select{width:auto;padding:6px 8px;font-size:.85rem;font-weight:600}
  .s-reservado{border-color:var(--etiqueta)!important;background:color-mix(in srgb,var(--etiqueta) 25%,var(--linho))!important}
  .s-vendido{color:var(--vendido)}
  .s-oculto{opacity:.7}
  .thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .ft{position:relative;width:84px}
  .ft img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block;background:var(--borda)}
  .ft .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;border-radius:50%;background:var(--erro);color:#fff;font-size:.85rem;line-height:22px}
  .ft .capa{position:absolute;left:4px;top:4px;padding:0 6px;border-radius:99px;background:var(--etiqueta);color:var(--sobre-etiqueta);font-size:.7rem;font-weight:800}
  .ft .mv{display:flex;gap:4px;margin-top:4px}
  .ft .mv button{flex:1;padding:2px 0;font-size:.9rem;background:transparent;color:var(--tinta);border:1px solid var(--borda)}
  .ft .mv button:disabled{opacity:.3;cursor:default}
  #msg{position:sticky;top:8px;z-index:5;padding:10px 14px;border-radius:10px;margin-bottom:12px;display:none;font-weight:800;color:#fff}
  #msg.ok{display:block;background:var(--musgo);color:var(--sobre-musgo)}
  #msg.err{display:block;background:var(--erro);color:#fff}
  .hide{display:none}
  .note{font-size:.85rem;color:var(--suave)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin do Bazar</h1>
  <div id="msg" role="status"></div>

  <div class="box" id="login">
    <h2>Conexão com o GitHub</h2>
    <p class="note">O token fica só neste navegador (localStorage). Use um token <i>fine-grained</i> restrito a este repositório, com permissão <i>Contents: Read and write</i>.</p>
    <div class="row">
      <div><label for="owner">Usuário/organização</label><input id="owner" placeholder="seu-usuario"></div>
      <div><label for="repo">Repositório</label><input id="repo" placeholder="mini-bazar"></div>
    </div>
    <div class="row">
      <div><label for="branch">Branch</label><input id="branch" value="master"></div>
      <div><label for="token">Token</label><input id="token" type="password" placeholder="github_pat_..."></div>
    </div>
    <p><button id="conectar">Conectar</button></p>
  </div>

  <div id="painel" class="hide">
    <div class="box">
      <div class="topo-lista">
        <h2>Produtos (<span id="cnt">0</span>)</h2>
        <div class="acts"><button id="novo">+ Novo produto</button><button class="sec" id="sair">Sair</button></div>
      </div>
      <div id="lista"></div>
    </div>

    <div class="box hide" id="form">
      <h2 id="ftitulo">Novo produto</h2>
      <label for="f-nome">Nome</label><input id="f-nome">
      <div class="row">
        <div><label for="f-preco">Preço (R$)</label><input id="f-preco" type="number" step="0.01" min="0"></div>
        <div><label for="f-cat">Categoria</label><input id="f-cat" list="cats" placeholder="Livros, Decoração..."><datalist id="cats"></datalist></div>
      </div>
      <div class="row">
        <div><label for="f-cond">Condição</label>
          <select id="f-cond"><option>Novo</option><option>Semi-novo</option><option>Usado</option></select></div>
        <div><label for="f-status">Status</label>
          <select id="f-status"><option value="disponivel">Disponível</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option><option value="oculto">Oculto</option></select></div>
      </div>
      <label for="f-desc">Descrição</label><textarea id="f-desc"></textarea>
      <label for="f-files">Fotos (até 8). A primeira é a capa; use as setas para mudar a ordem.</label>
      <input id="f-files" type="file" accept="image/*" multiple>
      <div class="thumbs" id="f-thumbs"></div>
      <p class="acts"><button id="salvar">Salvar no GitHub</button><button class="sec" id="cancelar">Cancelar</button></p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const STATUS = {disponivel:'Disponível', reservado:'Reservado', vendido:'Vendido', oculto:'Oculto'};
const MAX_FOTOS = 8;
let cfg = {}, produtos = [], sha = null, editando = null, imgs = [], novasFotos = {};

function aviso(t, tipo='ok'){ const m=$('msg'); m.textContent=t; m.className=tipo; clearTimeout(aviso.t); aviso.t=setTimeout(()=>m.className='',4500); }

const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

async function gh(path, opts = {}){
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const r = await fetch(url + (opts.method==='PUT'||opts.method==='DELETE' ? '' : `?ref=${cfg.branch}&t=${Date.now()}`), {
    ...opts,
    headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'}
  });
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(`${r.status}: ${e.message||'erro'}`); }
  return r.json();
}

async function carregar(){
  const d = await gh('products.json');
  sha = d.sha;
  produtos = JSON.parse(unb64(d.content));
  render();
}

async function salvarCatalogo(msg){
  const body = {message: msg, content: b64(JSON.stringify(produtos, null, 2) + '\n'), sha, branch: cfg.branch};
  const r = await gh('products.json', {method:'PUT', body: JSON.stringify(body)});
  sha = r.content.sha;
}

function render(){
  $('cnt').textContent = produtos.length;
  $('cats').innerHTML = [...new Set(produtos.map(p=>p.categoria))].map(c=>`<option value="${esc(c)}">`).join('');
  $('lista').innerHTML = produtos.map(p => `
    <div class="item">
      ${p.imagens?.[0] ? `<img src="${esc(p.imagens[0])}" alt="">` : '<div class="nofoto"></div>'}
      <div class="t"><b>${esc(p.nome)}</b><small>${brl(p.preco)} · ${esc(p.condicao)}${(p.imagens||[]).length>1 ? ` · ${p.imagens.length} fotos` : ''}</small></div>
      <select class="s-${esc(p.status)}" data-id="${esc(p.id)}" aria-label="Status de ${esc(p.nome)}">
        ${Object.entries(STATUS).map(([v,r]) => `<option value="${v}"${p.status===v?' selected':''}>${r}</option>`).join('')}
      </select>
      <div class="acts">
        <button class="sec" data-a="edit" data-id="${esc(p.id)}">Editar</button>
        <button class="del" data-a="del" data-id="${esc(p.id)}" aria-label="Excluir ${esc(p.nome)}">×</button>
      </div>
    </div>`).join('') || '<p class="note">Nenhum produto ainda. Clique em "Novo produto" para começar.</p>';
}

$('lista').onclick = async e => {
  const b = e.target.closest('button'); if(!b) return;
  const p = produtos.find(x => x.id === b.dataset.id); if(!p) return;
  try{
    if(b.dataset.a==='edit') abrirForm(p);
    if(b.dataset.a==='del' && confirm(`Excluir "${p.nome}"?`)){ produtos = produtos.filter(x=>x!==p); await salvarCatalogo(`Remove: ${p.nome}`); render(); aviso('Removido.'); }
  }catch(err){ aviso(err.message,'err'); await carregar().catch(()=>{}); }
};
$('lista').onchange = async e => {
  const s = e.target.closest('select'); if(!s) return;
  const p = produtos.find(x => x.id === s.dataset.id); if(!p) return;
  p.status = s.value; s.disabled = true;
  try{ await salvarCatalogo(`Status de ${p.nome}: ${STATUS[p.status]}`); render(); aviso(`Marcado como ${STATUS[p.status].toLowerCase()}.`); }
  catch(err){ aviso(err.message,'err'); await carregar().catch(()=>{}); }
};

function abrirForm(p){
  editando = p || null;
  $('ftitulo').textContent = p ? 'Editar produto' : 'Novo produto';
  $('f-nome').value = p?.nome||''; $('f-preco').value = p?.preco??''; $('f-cat').value = p?.categoria||'';
  $('f-cond').value = p?.condicao||'Usado'; $('f-status').value = p?.status||'disponivel'; $('f-desc').value = p?.descricao||'';
  imgs = [...(p?.imagens||[])]; novasFotos = {}; $('f-files').value='';
  thumbs(); $('form').classList.remove('hide'); $('form').scrollIntoView({behavior:'smooth'});
}
function thumbs(){
  $('f-thumbs').innerHTML = imgs.map((s,i)=>`
    <div class="ft">
      <img src="${novasFotos[s]?'data:image/jpeg;base64,'+novasFotos[s]:esc(s)}" alt="Foto ${i+1}">
      ${i===0 ? '<span class="capa">Capa</span>' : ''}
      <button class="x" data-i="${i}" aria-label="Remover foto ${i+1}">×</button>
      <div class="mv">
        <button data-i="${i}" data-m="-1" aria-label="Mover para antes"${i===0?' disabled':''}>‹</button>
        <button data-i="${i}" data-m="1" aria-label="Mover para depois"${i===imgs.length-1?' disabled':''}>›</button>
      </div>
    </div>`).join('');
}
$('f-thumbs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  const i = +b.dataset.i;
  if(b.classList.contains('x')){ const [r] = imgs.splice(i,1); delete novasFotos[r]; }
  else { const j = i + +b.dataset.m; if(j<0||j>=imgs.length) return; [imgs[i], imgs[j]] = [imgs[j], imgs[i]]; }
  thumbs();
};

function redimensionar(file, max=1200){
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.82).split(',')[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Não foi possível ler a imagem '+file.name)); };
    im.src = u;
  });
}
$('f-files').onchange = async e => {
  try{
    for(const f of e.target.files){
      if(imgs.length >= MAX_FOTOS){ aviso(`Limite de ${MAX_FOTOS} fotos por produto.`,'err'); break; }
      const b = await redimensionar(f);
      const nome = `img/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
      imgs.push(nome); novasFotos[nome] = b;
    }
  }catch(err){ aviso(err.message,'err'); }
  e.target.value = ''; thumbs();
};

const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

$('salvar').onclick = async () => {
  const nome = $('f-nome').value.trim();
  if(!nome) return aviso('Informe o nome do produto.','err');
  $('salvar').disabled = true;
  try{
    const novas = Object.entries(novasFotos).filter(([p]) => imgs.includes(p));
    let k = 0;
    for(const [path, content] of novas){
      $('salvar').textContent = `Enviando foto ${++k} de ${novas.length}...`;
      await gh(path, {method:'PUT', body: JSON.stringify({message:`Foto: ${nome}`, content, branch: cfg.branch})});
    }
    $('salvar').textContent = 'Salvando...';
    const dados = {
      id: editando?.id || `${slug(nome)}-${Date.now().toString(36)}`,
      nome, categoria: $('f-cat').value.trim() || 'Outros', condicao: $('f-cond').value,
      preco: Number($('f-preco').value)||0, descricao: $('f-desc').value.trim(),
      imagens: imgs, status: $('f-status').value
    };
    const era = !!editando;
    if(editando) Object.assign(editando, dados); else produtos.unshift(dados);
    await salvarCatalogo(`${era?'Edita':'Adiciona'}: ${nome}`);
    $('form').classList.add('hide'); render(); aviso('Salvo! O site atualiza em cerca de 1 minuto.');
  }catch(err){ aviso(err.message,'err'); await carregar().catch(()=>{}); }
  $('salvar').disabled = false; $('salvar').textContent = 'Salvar no GitHub';
};
$('cancelar').onclick = () => $('form').classList.add('hide');
$('novo').onclick = () => abrirForm(null);

$('conectar').onclick = async () => {
  cfg = {owner:$('owner').value.trim(), repo:$('repo').value.trim(), branch:$('branch').value.trim()||'master', token:$('token').value.trim()};
  try{
    await carregar();
    localStorage.setItem('bazar-cfg', JSON.stringify(cfg));
    $('login').classList.add('hide'); $('painel').classList.remove('hide');
  }catch(err){ aviso('Falha ao conectar: '+err.message,'err'); }
};
$('sair').onclick = () => { localStorage.removeItem('bazar-cfg'); location.reload(); };

try{
  const s = JSON.parse(localStorage.getItem('bazar-cfg')||'null');
  if(s){ ['owner','repo','branch','token'].forEach(k=>$(k).value=s[k]||''); $('conectar').click(); }
}catch(e){}
</script>
</body>
</html>
