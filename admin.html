<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Bazar</title>
<style>
  :root{--bg:#f4f1ec;--card:#fff;--ink:#2b2622;--mut:#7a7068;--acc:#c2410c;--bd:#e0d9cf;--ok:#15803d}
  @media(prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--ink:#f5f0ea;--mut:#a8a29e;--acc:#fb923c;--bd:#3f3a36;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:820px;margin:auto;padding:16px}
  h1{font-size:1.5rem;margin:8px 0 16px}
  .box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:80px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer;font-size:.95rem}
  button.sec{background:var(--bd);color:var(--ink)}
  button.del{background:#b91c1c}
  .item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
  .item:first-child{border-top:0}
  .item img,.item .nofoto{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bd);flex:none}
  .item .t{flex:1;min-width:0}
  .item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item small{color:var(--mut)}
  .st{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bd)}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{padding:6px 10px;font-size:.8rem}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumbs div{position:relative}
  .thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px}
  .thumbs span{position:absolute;top:-6px;right:-6px;background:#b91c1c;color:#fff;border-radius:99px;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer;font-size:.8rem}
  #msg{position:sticky;top:0;padding:10px;border-radius:10px;margin-bottom:12px;display:none;font-weight:600}
  #msg.ok{display:block;background:var(--ok);color:#fff}
  #msg.err{display:block;background:#b91c1c;color:#fff}
  .hide{display:none}
  .note{font-size:.8rem;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Admin do Bazar</h1>
  <div id="msg"></div>

  <div class="box" id="login">
    <b>Conexão com o GitHub</b>
    <p class="note">O token fica só neste navegador (localStorage). Use um token <i>fine-grained</i> restrito a este repositório, com permissão <i>Contents: Read and write</i>.</p>
    <div class="row">
      <div><label>Usuário/organização</label><input id="owner" placeholder="seu-usuario"></div>
      <div><label>Repositório</label><input id="repo" placeholder="mini-bazar"></div>
    </div>
    <div class="row">
      <div><label>Branch</label><input id="branch" value="main"></div>
      <div><label>Token</label><input id="token" type="password" placeholder="github_pat_..."></div>
    </div>
    <p><button id="conectar">Conectar</button></p>
  </div>

  <div id="painel" class="hide">
    <div class="box">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <b>Produtos (<span id="cnt">0</span>)</b>
        <div class="acts"><button id="novo">+ Novo produto</button><button class="sec" id="sair">Sair</button></div>
      </div>
      <div id="lista"></div>
    </div>

    <div class="box hide" id="form">
      <b id="ftitulo">Novo produto</b>
      <label>Nome</label><input id="f-nome">
      <div class="row">
        <div><label>Preço (R$)</label><input id="f-preco" type="number" step="0.01" min="0"></div>
        <div><label>Categoria</label><input id="f-cat" list="cats" placeholder="Livros, Decoração..."><datalist id="cats"></datalist></div>
      </div>
      <div class="row">
        <div><label>Condição</label>
          <select id="f-cond"><option>Novo</option><option>Semi-novo</option><option>Usado</option></select></div>
        <div><label>Status</label>
          <select id="f-status"><option value="disponivel">Disponível</option><option value="vendido">Vendido</option><option value="oculto">Oculto</option></select></div>
      </div>
      <label>Descrição</label><textarea id="f-desc"></textarea>
      <label>Fotos (redimensionadas automaticamente)</label>
      <input id="f-files" type="file" accept="image/*" multiple>
      <div class="thumbs" id="f-thumbs"></div>
      <p class="acts"><button id="salvar">Salvar no GitHub</button><button class="sec" id="cancelar">Cancelar</button></p>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg = {}, produtos = [], sha = null, editando = null, imgs = [], novasFotos = {};

function aviso(t, tipo='ok'){ const m=$('msg'); m.textContent=t; m.className=tipo; setTimeout(()=>m.className='',4500); }

const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

async function gh(path, opts = {}){
  const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const r = await fetch(url + (opts.method==='PUT'||opts.method==='DELETE' ? '' : `?ref=${cfg.branch}&t=${Date.now()}`), {
    ...opts,
    headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'}
  });
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(`${r.status}: ${e.message||'erro'}`); }
  return r.json();
}

async function carregar(){
  const d = await gh('products.json');
  sha = d.sha;
  produtos = JSON.parse(unb64(d.content));
  render();
}

async function salvarCatalogo(msg){
  const body = {message: msg, content: b64(JSON.stringify(produtos, null, 2) + '\n'), sha, branch: cfg.branch};
  const r = await gh('products.json', {method:'PUT', body: JSON.stringify(body)});
  sha = r.content.sha;
}

function render(){
  $('cnt').textContent = produtos.length;
  $('cats').innerHTML = [...new Set(produtos.map(p=>p.categoria))].map(c=>`<option value="${esc(c)}">`).join('');
  $('lista').innerHTML = produtos.map(p => `
    <div class="item">
      ${p.imagens?.[0] ? `<img src="../${esc(p.imagens[0])}" onerror="this.src='${esc(p.imagens[0])}'">` : '<div class="nofoto"></div>'}
      <div class="t"><b>${esc(p.nome)}</b><small>R$ ${Number(p.preco).toFixed(2)} · ${esc(p.condicao)} · <span class="st">${esc(p.status)}</span></small></div>
      <div class="acts">
        <button class="sec" data-a="edit" data-id="${esc(p.id)}">Editar</button>
        <button class="sec" data-a="sold" data-id="${esc(p.id)}">${p.status==='vendido'?'Reabrir':'Vendido'}</button>
        <button class="del" data-a="del" data-id="${esc(p.id)}">×</button>
      </div>
    </div>`).join('') || '<p class="note">Nenhum produto ainda.</p>';
}

$('lista').onclick = async e => {
  const b = e.target.closest('button'); if(!b) return;
  const p = produtos.find(x => x.id === b.dataset.id);
  try{
    if(b.dataset.a==='edit') abrirForm(p);
    if(b.dataset.a==='sold'){ p.status = p.status==='vendido'?'disponivel':'vendido'; await salvarCatalogo(`Atualiza status: ${p.nome}`); render(); aviso('Atualizado.'); }
    if(b.dataset.a==='del' && confirm(`Excluir "${p.nome}"?`)){ produtos = produtos.filter(x=>x!==p); await salvarCatalogo(`Remove: ${p.nome}`); render(); aviso('Removido.'); }
  }catch(err){ aviso(err.message,'err'); await carregar().catch(()=>{}); }
};

function abrirForm(p){
  editando = p || null;
  $('ftitulo').textContent = p ? 'Editar produto' : 'Novo produto';
  $('f-nome').value = p?.nome||''; $('f-preco').value = p?.preco??''; $('f-cat').value = p?.categoria||'';
  $('f-cond').value = p?.condicao||'Usado'; $('f-status').value = p?.status||'disponivel'; $('f-desc').value = p?.descricao||'';
  imgs = [...(p?.imagens||[])]; novasFotos = {}; $('f-files').value='';
  thumbs(); $('form').classList.remove('hide'); $('form').scrollIntoView({behavior:'smooth'});
}
function thumbs(){
  $('f-thumbs').innerHTML = imgs.map((s,i)=>`<div><img src="${novasFotos[s]?'data:image/jpeg;base64,'+novasFotos[s]:esc(s)}"><span data-i="${i}">×</span></div>`).join('');
}
$('f-thumbs').onclick = e => { const s=e.target.closest('span'); if(!s) return; const [r]=imgs.splice(+s.dataset.i,1); delete novasFotos[r]; thumbs(); };

function redimensionar(file, max=1200){
  return new Promise((res, rej) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.82).split(',')[1]);
    };
    im.onerror = rej; im.src = u;
  });
}
$('f-files').onchange = async e => {
  for(const f of e.target.files){
    const b = await redimensionar(f);
    const nome = `img/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
    imgs.push(nome); novasFotos[nome] = b;
  }
  thumbs();
};

const slug = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

$('salvar').onclick = async () => {
  const nome = $('f-nome').value.trim();
  if(!nome) return aviso('Informe o nome.','err');
  $('salvar').disabled = true; $('salvar').textContent = 'Salvando...';
  try{
    for(const [path, content] of Object.entries(novasFotos)){
      if(!imgs.includes(path)) continue;
      await gh(path, {method:'PUT', body: JSON.stringify({message:`Foto: ${nome}`, content, branch: cfg.branch})});
    }
    const dados = {
      id: editando?.id || `${slug(nome)}-${Date.now().toString(36)}`,
      nome, categoria: $('f-cat').value.trim() || 'Outros', condicao: $('f-cond').value,
      preco: Number($('f-preco').value)||0, descricao: $('f-desc').value.trim(),
      imagens: imgs, status: $('f-status').value
    };
    if(editando) Object.assign(editando, dados); else produtos.unshift(dados);
    await salvarCatalogo(`${editando?'Edita':'Adiciona'}: ${nome}`);
    $('form').classList.add('hide'); render(); aviso('Salvo! O site atualiza em ~1 minuto.');
  }catch(err){ aviso(err.message,'err'); await carregar().catch(()=>{}); }
  $('salvar').disabled = false; $('salvar').textContent = 'Salvar no GitHub';
};
$('cancelar').onclick = () => $('form').classList.add('hide');
$('novo').onclick = () => abrirForm(null);

$('conectar').onclick = async () => {
  cfg = {owner:$('owner').value.trim(), repo:$('repo').value.trim(), branch:$('branch').value.trim()||'main', token:$('token').value.trim()};
  try{
    await carregar();
    localStorage.setItem('bazar-cfg', JSON.stringify(cfg));
    $('login').classList.add('hide'); $('painel').classList.remove('hide');
  }catch(err){ aviso('Falha ao conectar: '+err.message,'err'); }
};
$('sair').onclick = () => { localStorage.removeItem('bazar-cfg'); location.reload(); };

try{
  const s = JSON.parse(localStorage.getItem('bazar-cfg')||'null');
  if(s){ ['owner','repo','branch','token'].forEach(k=>$(k).value=s[k]||''); $('conectar').click(); }
}catch(e){}
</script>
</body>
</html>
